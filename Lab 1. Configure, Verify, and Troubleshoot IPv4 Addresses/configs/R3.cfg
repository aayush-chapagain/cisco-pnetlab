! ==========================================
! R3.cfg - Lab 1: Configure, Verify, and Troubleshoot IPv4 Addresses
! ==========================================
 
! Task 1 : Hostname
enable
configure terminal
hostname R3
 
! Task 2 : Interface IP Addressing
interface e0/0
 ip address 172.16.1.2 255.255.255.192
 no shutdown
exit
 
interface loopback10
 ip address 10.10.10.3 255.255.255.128
exit
 
interface loopback20
 ip address 10.20.20.3 255.255.255.240
exit
 
interface loopback30
 ip address 10.30.30.3 255.255.255.248
exit
 
! Task 3 : Verification
end
show ip interface brief
show interfaces e0/0
show running-config