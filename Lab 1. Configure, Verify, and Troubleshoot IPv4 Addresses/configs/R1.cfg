! ==========================================
! R1.cfg - Lab 1: Configure, Verify, and Troubleshoot IPv4 Addresses
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R1

! Task 2 : Interface IP Addressing
interface e0/0
 ip address 172.16.1.1 255.255.255.192
 no shutdown
exit

! Task 3 : Verification
end
show ip interface brief
show interfaces e0/0
show running-config