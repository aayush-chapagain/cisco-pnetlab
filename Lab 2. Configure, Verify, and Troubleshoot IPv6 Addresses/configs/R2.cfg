! ==========================================
! R2.cfg - Lab 2: Configure, Verify, and Troubleshoot IPv6 Addresses
! ==========================================
 
! Task 1 : Hostname
enable
configure terminal
hostname R2
 
! Task 2 : Interface IPv6 Addressing
ipv6 unicast-routing
interface e0/0
 ipv6 address 2001:aBcD:abcd::2/64
 no shutdown
exit
 
interface loopback 0
 ipv6 address 2001::5/64
exit
 
 
! Task 3 : Verification
end
show ipv6 interface brief
show ipv6 interface e0/0
show running-config