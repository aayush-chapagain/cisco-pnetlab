! ==========================================
! R3.cfg - Lab 4: ARP and Proxy ARP
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R3

! Task 2 : Interface IP Addressing
interface e0/1
 ip address 192.168.1.2 255.255.255.0
 no shutdown
exit

! Default route out the exit interface (no next-hop IP specified).
! This is what forces R3 to rely on ARP/Proxy ARP to reach R1's network.
ip route 0.0.0.0 0.0.0.0 e0/1

! Task 3 : Verification
end
show arp
show ip route
show ip interface brief
ping 10.0.0.1
