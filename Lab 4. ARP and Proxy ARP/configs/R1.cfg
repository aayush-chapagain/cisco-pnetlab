! ==========================================
! R1.cfg - Lab 4: ARP and Proxy ARP
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R1

! Task 2 : Interface IP Addressing
interface e0/0
 ip address 10.0.0.1 255.0.0.0
 no shutdown
exit

! Default route out the exit interface (no next-hop IP specified).
! This is what forces R1 to rely on ARP/Proxy ARP to reach R3's network.
ip route 0.0.0.0 0.0.0.0 e0/0

! Task 3 : Verification
end
show arp
show ip route
show ip interface brief
ping 192.168.1.2
