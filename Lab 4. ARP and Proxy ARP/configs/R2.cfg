! ==========================================
! R2.cfg - Lab 4: ARP and Proxy ARP
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R2

! Task 2 : Interface IP Addressing
interface e0/0
 ip address 10.0.0.2 255.0.0.0
 no shutdown
exit

interface e0/1
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit

! No static route needed on R2 - it is directly connected to both
! the 10.0.0.0/8 and 192.168.1.0/24 networks. Proxy ARP is enabled
! by default on Cisco IOS interfaces ("ip proxy-arp"), which is what
! allows R2 to answer ARP requests on R1's behalf for hosts on R3's
! subnet, and vice versa.

! Task 3 : Verification
end
show arp
show ip route
show ip interface brief
