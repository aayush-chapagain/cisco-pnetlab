! ==========================================
! R1.cfg - Lab 3: IPv6 Address Autoconfiguration
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R1

! Task 2 : Interface IPv6 Addressing
ipv6 unicast-routing
interface e0/0
 ipv6 address 2001:ABCD:ABCD::1/64
 no shutdown
exit

! Task 3 : Verification
end
show ipv6 interface brief
show ipv6 interface e0/0
show running-config
