! ==========================================
! R2.cfg - Lab 3: IPv6 Address Autoconfiguration
! ==========================================

! Task 1 : Hostname
enable
configure terminal
hostname R2

! Task 2 : Interface IPv6 Addressing
ipv6 unicast-routing
interface e0/0
 ipv6 address autoconfig
 no shutdown
exit

interface loopback 0
 ipv6 address 2001:AAAA:AAAA:AAAA::/64 eui-64
exit

! Task 3 : Verification
end
show ipv6 interface brief
show ipv6 interface e0/0
show ipv6 interface loopback 0
show running-config
